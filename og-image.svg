<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#C0184C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D0A0E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D0A0E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="630" fill="#0D0A0E"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- borda esquerda vermelha -->
  <rect x="0" y="0" width="6" height="630" fill="#C0184C"/>

  <!-- corações decorativos -->
  <text x="980" y="180" font-size="180" fill="#C0184C" opacity="0.08" font-family="serif">♥</text>
  <text x="60"  y="560" font-size="120" fill="#FF6B9D" opacity="0.06" font-family="serif">♥</text>
  <text x="1080" y="580" font-size="80" fill="#FF6B9D" opacity="0.1" font-family="serif">♥</text>
  <text x="500" y="80"  font-size="60"  fill="#C0184C" opacity="0.12" font-family="serif">♥</text>

  <!-- tag -->
  <rect x="80" y="80" width="280" height="36" rx="0" fill="#C0184C"/>
  <text x="96" y="104" font-family="Arial Black, sans-serif" font-size="13" fill="white" letter-spacing="3" text-transform="uppercase">OFERTA · DIA DOS NAMORADOS</text>

  <!-- título principal -->
  <text x="80" y="210" font-family="Georgia, serif" font-size="82" font-weight="900" fill="#FDF4F7" letter-spacing="-2">Se cuidar juntos</text>
  <text x="80" y="305" font-family="Georgia, serif" font-size="82" font-weight="900" fill="#FF6B9D" font-style="italic" letter-spacing="-2">é o maior ato</text>
  <text x="80" y="400" font-family="Georgia, serif" font-size="82" font-weight="900" fill="#FDF4F7" letter-spacing="-2">de amor.</text>

  <!-- subtítulo -->
  <text x="80" y="470" font-family="Arial, sans-serif" font-size="24" fill="#8A7882" letter-spacing="1">Nutrição · Emagrecimento · Hábitos Saudáveis para os dois</text>

  <!-- linha separadora -->
  <rect x="80" y="510" width="600" height="2" fill="#2A1820"/>

  <!-- logo -->
  <text x="80" y="558" font-family="Arial Black, sans-serif" font-size="28" fill="#3A2830" letter-spacing="3">DUO</text>
  <text x="142" y="558" font-family="Arial Black, sans-serif" font-size="28" fill="#C0184C" letter-spacing="3">SAÚDE</text>

  <!-- coração logo -->
  <text x="1080" y="340" font-size="100" fill="#C0184C" opacity="0.9" font-family="serif">♥</text>

  <!-- CTA -->
  <rect x="800" y="480" width="340" height="60" rx="0" fill="#C0184C"/>
  <text x="970" y="518" font-family="Arial Black, sans-serif" font-size="16" fill="white" text-anchor="middle" letter-spacing="2">SAIBA MAIS →</text>
</svg>
